llm:
  base_url: http://localhost:1234/v1
  model: google/gemma-4-e4b
  api_key: local
  temperature: 0.1
  timeout: 180
  json_mode: false
  reasoning_effort: "none"
  cache: true

browser:
  debugger_address: 127.0.0.1:9222
  kind: edge
  window: taskagent

search:
  url: 'https://html.duckduckgo.com/html/?q={q}'
  max_chars: 4000

agent:
  max_depth: 2
  max_steps: 30
  max_node_steps: 8
  max_subtasks: 4
  observation_chars: 2500
  tools: [web_search, open_page, http_get, read_file, write_file, list_files, remember, recall]
  skills: []

memory:
  enabled: true
  path: data/memory
  collection: memory
  embedding_model: ""
  auto_store: true
  auto_recall: 3
  auto_recall_min_score: 0.3

paths:
  db: data/agent.db
  workspace: data/workspace

schedule:
  tick_minutes: 1

tasks: tasks.yaml
