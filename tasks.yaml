tasks:
  - name: jobs
    enabled: true
    skill: jobs
    every_minutes: 60
    params:
      config: jobs.yaml
      sources: [web, linkedin]
      discover_only: false

  - name: example-research
    enabled: false
    goal: >
      Find three recently released open-source Java libraries for building LLM agents. For each give the name,
      URL, latest version and a one-line summary, then save them as a markdown table to reports/java-agents.md.
    every_minutes: 1440
    output: reports/java-agents-summary.md
    agent:
      max_steps: 25

  - name: example-watch
    enabled: false
    goal: >
      Check https://news.ycombinator.com for new posts about Java or LLM agents that are not in memory yet.
      Remember each new one (title, URL, one-line summary) and append it to reports/hn-watch.md.
    continuous: true
    active_hours: "09:00-23:00"
